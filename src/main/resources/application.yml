spring:
  mvc:
    problem details:
      enabled: true
  datasource:
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: "org.hibernate.dialect.H2Dialect"
    hibernate:
      ddl-auto: update
      #FIXED: run data.sql after Hibernate schema set up, needed because we set ddl auto update
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

# ==================================================================
# API Doc / Swagger
# ==================================================================

spring-doc:
  pathsToMatch: /api/**
  show-actuator: true
  swagger-ui.enabled: true

  api-docs:
    path: /api-docs